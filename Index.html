ain,.person.novote{background:rgba(197,197,197,.18);border-color:rgba(160,160,160,.35)}.person.absent{background:repeating-linear-gradient(135deg,rgba(255,255,255,.7) 0,rgba(255,255,255,.7) 10px,rgba(230,230,230,.85) 10px,rgba(230,230,230,.85) 18px);border-color:#d4d4d4}.portrait{height:92px;width:92px;max-width:100%;border-radius:50%;display:block;object-fit:cover;object-position:center 24%;filter:grayscale(1);border:4px solid var(--green);background:#fff}.person.yes .portrait,.person.no .portrait{border-color:#fff}.person.no .portrait{box-shadow:0 0 0 2px var(--red)}.person.abstain .portrait,.person.novote .portrait{border-color:var(--gray)}.portrait.absent{border:4px solid transparent;background-image:linear-gradient(white,white),repeating-linear-gradient(135deg,#fff 0,#fff 3px,#cfcfcf 3px,#cfcfcf 5px);background-origin:border-box;background-clip:padding-box,border-box}.name{display:block;font-size:14px;line-height:1.1;font-weight:700;margin-top:10px}.block{font-size:10px;line-height:1.15;color:#888;text-transform:uppercase;margin-top:5px}.vote-text{font-size:11px;font-weight:700;margin-top:9px;color:var(--green)}.person.no .vote-text{color:var(--red)}.person.abstain .vote-text,.person.novote .vote-text,.vote-text.neutral{color:#777}.vote-text.absent{color:#888}.detail{margin:16px auto 0;max-width:600px;background:#f6f6f6;border-left:4px solid var(--green);padding:13px 16px;font-size:14px;line-height:1.5}.detail.no{border-left-color:var(--red)}.detail.abstain,.detail.novote,.detail.absent{border-left-color:#aaa}.note{text-align:center;color:#777;font-size:12px;margin:15px 0 0}@media(max-width:800px){.widget{padding:12px}.results{padding:25px 15px}.persons{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px}.local{padding:26px 0}.portrait{height:82px;width:82px}.bar,.threshold{height:45px}.threshold-text{top:64px}.local-legend{margin-bottom:20px}}@media(max-width:440px){.widget{padding:8px}.heading{font-size:20px}.tab{flex:1;min-width:0;padding:11px 9px;fon const projects={propiedad:{name:'Ley de inviolabilidad de la propiedad privada',chamber:{yes:124,no:119,abstain:6,novote:0,absent:7,majority:122},votes:{bruno:'Afirmativo',flores:'Afirmativo',moreno:'Afirmativo',zapata:'Afirmativo',biella:'Afirmativo',outes:'Ausente',vega:'Ausente'}},discapacidad:{name:'Ley de discapacidad',chamber:{yes:237,no:9,abstain:4,novote:1,absent:6,majority:null},votes:{bruno:'Afirmativo',flores:'Afirmativo',moreno:'Afirmativo',zapata:'Afirmativo',biella:'Afirmativo',outes:'Afirmativo',vega:'Ausente'}}};
let project='propiedad',selected=null;const $=id=>document.getElementById(id);
function legendItem(type,label,count){return `<span class="legend-item"><span class="swatch ${type}" aria-hidden="true"></span>${label}: <strong>${count}</strong></span>`}
function getVoteMeta(vote){if(vote==='Afirmativo')return{key:'yes',card:'yes',text:'A FAVOR'};if(vote==='Negativo')return{key:'no',card:'no',text:'EN CONTRA'};if(vote==='Abstención')return{key:'abstain',card:'abstain',text:'ABSTENCIÓN'};if(vote==='Sin votar')return{key:'novote',card:'novote',text:'SIN VOTAR'};return{key:'absent',card:'absent',text:'AUSENTE'}}
function render(){const p=projects[project],c=p.chamber,total=c.yes+c.no+c.abstain+c.novote+c.absent;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.project===project)));$('project-name').textContent=p.name;$('yes-count').textContent=c.yes;$('no-count').textContent=c.no;const entries=[['yes',c.yes,'A favor'],['no',c.no,'En contra'],['abstain',c.abstain,'Abstenciones'],['novote',c.novote,'Sin votar'],['absent',c.absent,'Ausentes']];$('bar').innerHTML=entries.filter(e=>e[1]>0).map(e=>`<div class="segment seg-${e[0]}" style="width:${e[1]/total*100}%" title="${e[2]}: ${e[1]}"></div>`).join('');$('bar').setAttribute('aria-label',entries.filter(e=>e[1]).map(e=>`${e[2]}: ${e[1]}`).join('; '));$('threshold').style.display=c.majority?'':'none';$('threshold-text').style.display=c.majority?'':'none';if(c.majority){$('threshold').style.left=(c.majority/total*100)+'%';$('threshold-text').textContent='MAYORÍA SIMPLE: '+c.majority;}$('chamber-legend').innerHTML=[legendItem('abstain','ABSTENCIONES',c.abstain),...(c.novote?[legendItem('novote','SIN VOTAR',c.novote)]:[]),legendItem('absent','AUSENTES',c.absent)].filter(Boolean).join('');const counts={yes:0,no:0,abstain:0,novote:0,absent:0};deputies.forEach(d=>{const meta=getVoteMeta(p.votes[d.id]);counts[meta.key]++});$('salta-legend').innerHTML=[counts.yes?`<span class="yes-text">● A FAVOR ${counts.yes}</span>`:'',counts.no?`<span class="no-text">● EN CONTRA ${counts.no}</span>`:'',counts.abstain?`<span class="absent-text">● ABSTENCIÓN ${counts.abstain}</span>`:'',counts.novote?`<span class="absent-text">● SIN VOTAR ${counts.novote}</span>`:'',counts.absent?`<span class="absent-text">◯ AUSENTES ${counts.absent}</span>`:''].join('');$('persons').innerHTML=deputies.map(d=>{const meta=getVoteMeta(p.votes[d.id]);const a=meta.key==='absent';const neutral=(meta.key==='abstain'||meta.key==='novote')?'neutral':'';return `<button type="button" class="person ${meta.card}" data-id="${d.id}" aria-pressed="${selected===d.id}" aria-label="${d.name}: ${p.votes[d.id]}"><img class="portrait ${a?'absent':''}" src="${portraits[d.id]}" alt="" loading="lazy"><span class="name">${d.name}</span><span class="block">${d.block}</span><span class="vote-text ${a?'absent':''} ${neutral}">${meta.text}</span></button>`}).join('');document.querySelectorAll('.person').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.id;render()}));const d=deputies.find(d=>d.id===selected);$('detail').hidden=!d;if(d){const meta=getVoteMeta(p.votes[d.id]);$('detail').className='detail '+(meta.card||'');$('detail').textContent=`${d.name} · ${d.block} · ${p.name}: ${p.votes[d.id]}.`;}requestAnimationFrame(reportHeight)}
function reportHeight(){try{parent.postMessage({type:'eltribuno-votacion-height',height:document.documentElement.scrollHeight},'*')}catch(e){}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{project=b.dataset.project;selected=null;render()}));window.addEventListener('resize',reportHeight);if(window.ResizeObserver){new ResizeObserver(reportHeight).observe(document.body)}render();
</script></body></html>
